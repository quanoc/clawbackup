<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a67d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dd6b20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38a169;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f855a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#718096;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e53e3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c53030;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1000" height="700" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="500" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#2d3748" font-family="system-ui, -apple-system, sans-serif">Cline 数据流时序图</text>
  <text x="500" y="75" text-anchor="middle" font-size="13" fill="#718096" font-family="system-ui, -apple-system, sans-serif">用户请求到响应完成的完整流程</text>
  
  <!-- 生命线标题 -->
  <g transform="translate(100, 100)">
    <rect width="120" height="50" rx="8" fill="url(#userGrad)" filter="url(#shadow2)"/>
    <text x="60" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">用户</text>
  </g>
  
  <g transform="translate(250, 100)">
    <rect width="120" height="50" rx="8" fill="url(#apiGrad)" filter="url(#shadow2)"/>
    <text x="60" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">API 层</text>
  </g>
  
  <g transform="translate(400, 100)">
    <rect width="140" height="50" rx="8" fill="url(#aiGrad)" filter="url(#shadow2)"/>
    <text x="70" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">AI 模型</text>
  </g>
  
  <g transform="translate(580, 100)">
    <rect width="120" height="50" rx="8" fill="url(#fsGrad)" filter="url(#shadow2)"/>
    <text x="60" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">文件系统</text>
  </g>
  
  <g transform="translate(740, 100)">
    <rect width="120" height="50" rx="8" fill="url(#termGrad)" filter="url(#shadow2)"/>
    <text x="60" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">终端</text>
  </g>
  
  <g transform="translate(880, 100)">
    <rect width="100" height="50" rx="8" fill="url(#secGrad)" filter="url(#shadow2)"/>
    <text x="50" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">安全</text>
  </g>
  
  <!-- 生命线 -->
  <line x1="160" y1="150" x2="160" y2="620" stroke="#667eea" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="310" y1="150" x2="310" y2="620" stroke="#4a90e2" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="470" y1="150" x2="470" y2="620" stroke="#ed8936" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="640" y1="150" x2="640" y2="620" stroke="#38a169" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="800" y1="150" x2="800" y2="620" stroke="#718096" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="930" y1="150" x2="930" y2="620" stroke="#e53e3e" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- 激活框 -->
  <rect x="300" y="200" width="20" height="80" rx="3" fill="#4a90e2" opacity="0.3"/>
  <rect x="460" y="220" width="20" height="100" rx="3" fill="#ed8936" opacity="0.3"/>
  <rect x="300" y="340" width="20" height="120" rx="3" fill="#4a90e2" opacity="0.3"/>
  <rect x="630" y="380" width="20" height="60" rx="3" fill="#38a169" opacity="0.3"/>
  <rect x="920" y="200" width="20" height="240" rx="3" fill="#e53e3e" opacity="0.3"/>
  
  <!-- 箭头和标签 -->
  <!-- 1. 用户发起请求 -->
  <line x1="160" y1="210" x2="300" y2="210" stroke="#2d3748" stroke-width="2" marker-end="url(#arrowheadSeq)"/>
  <text x="230" y="200" text-anchor="middle" font-size="11" fill="#2d3748" font-family="system-ui, -apple-system, sans-serif">1. 发起请求</text>
  
  <!-- 2. 安全审计 -->
  <line x1="310" y1="230" x2="920" y2="230" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowheadSeq)"/>
  <text x="615" y="220" text-anchor="middle" font-size="11" fill="#e53e3e" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">2. 权限验证</text>
  
  <!-- 3. 转发到 AI -->
  <line x1="310" y1="250" x2="460" y2="250" stroke="#ed8936" stroke-width="2" marker-end="url(#arrowheadSeq)"/>
  <text x="385" y="240" text-anchor="middle" font-size="11" fill="#ed8936" font-family="system-ui, -apple-system, sans-serif">3. 转发请求</text>
  
  <!-- 4. AI 处理 -->
  <line x1="470" y1="280" x2="470" y2="300" stroke="#ed8936" stroke-width="2"/>
  <text x="490" y="295" font-size="10" fill="#ed8936" font-family="system-ui, -apple-system, sans-serif">推理中...</text>
  
  <!-- 5. AI 返回响应 -->
  <line x1="460" y1="320" x2="310" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowheadSeq)"/>
  <text x="385" y="310" text-anchor="middle" font-size="11" fill="#4a90e2" font-family="system-ui, -apple-system, sans-serif">4. 返回响应</text>
  
  <!-- 6. 解析指令 -->
  <rect x="295" y="350" width="30" height="30" rx="3" fill="#4a90e2" opacity="0.2"/>
  <text x="385" y="365" font-size="10" fill="#2d3748" font-family="system-ui, -apple-system, sans-serif">5. 解析 AI 指令</text>
  
  <!-- 7. 文件操作 -->
  <line x1="310" y1="390" x2="630" y2="390" stroke="#38a169" stroke-width="2" marker-end="url(#arrowheadSeq)"/>
  <text x="470" y="380" text-anchor="middle" font-size="11" fill="#38a169" font-family="system-ui, -apple-system, sans-serif">6. 读取/写入文件</text>
  
  <!-- 8. 文件操作审计 -->
  <line x1="640" y1="410" x2="920" y2="410" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowheadSeq)"/>
  <text x="780" y="400" text-anchor="middle" font-size="11" fill="#e53e3e" font-family="system-ui, -apple-system, sans-serif">审计</text>
  
  <!-- 9. 终端命令 -->
  <line x1="310" y1="430" x2="790" y2="430" stroke="#718096" stroke-width="2" marker-end="url(#arrowheadSeq)"/>
  <text x="550" y="420" text-anchor="middle" font-size="11" fill="#718096" font-family="system-ui, -apple-system, sans-serif">7. 执行 Shell 命令</text>
  
  <!-- 10. 终端审计 -->
  <line x1="800" y1="450" x2="920" y2="450" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowheadSeq)"/>
  <text x="860" y="440" text-anchor="middle" font-size="11" fill="#e53e3e" font-family="system-ui, -apple-system, sans-serif">审计</text>
  
  <!-- 11. 返回结果 -->
  <line x1="310" y1="480" x2="160" y2="480" stroke="#667eea" stroke-width="2" marker-end="url(#arrowheadSeq)"/>
  <text x="230" y="470" text-anchor="middle" font-size="11" fill="#667eea" font-weight="bold" font-family="system-ui, -apple-system, sans-serif">8. 返回最终结果</text>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowheadSeq" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d3748"/>
    </marker>
  </defs>
  
  <!-- 图例 -->
  <rect x="50" y="540" width="400" height="140" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="565" font-size="13" font-weight="bold" fill="#2d3748" font-family="system-ui, -apple-system, sans-serif">图例说明</text>
  
  <line x1="70" y1="585" x2="100" y2="585" stroke="#2d3748" stroke-width="2"/>
  <text x="110" y="590" font-size="11" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">请求流</text>
  
  <line x1="70" y1="610" x2="100" y2="610" stroke="#e53e3e" stroke-width="2"/>
  <text x="110" y="615" font-size="11" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">安全审计（所有操作）</text>
  
  <rect x="200" y="580" width="20" height="15" rx="2" fill="#4a90e2" opacity="0.3"/>
  <text x="230" y="592" font-size="11" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">组件激活状态</text>
  
  <text x="70" y="640" font-size="11" fill="#718096" font-family="system-ui, -apple-system, sans-serif">虚线生命线表示组件持续运行</text>
  <text x="70" y="660" font-size="11" fill="#718096" font-family="system-ui, -apple-system, sans-serif">实线箭头表示数据/控制流方向</text>
  
  <!-- 右侧流程编号 -->
  <rect x="700" y="540" width="250" height="140" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="720" y="565" font-size="13" font-weight="bold" fill="#2d3748" font-family="system-ui, -apple-system, sans-serif">流程步骤</text>
  <text x="720" y="590" font-size="10" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">1. 用户通过聊天面板发起请求</text>
  <text x="720" y="610" font-size="10" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">2. 安全层验证权限和策略</text>
  <text x="720" y="630" font-size="10" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">3-4. API 转发到 AI 模型进行推理</text>
  <text x="720" y="650" font-size="10" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">5-6. 解析响应并执行文件/终端操作</text>
  <text x="720" y="670" font-size="10" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">7-8. 所有操作审计后返回结果</text>
</svg>
