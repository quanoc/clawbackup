<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变 -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a67d8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8936;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dd6b20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38a169;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f855a;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <!-- 图标定义 -->
    <g id="userIcon">
      <circle cx="15" cy="12" r="6" fill="white" opacity="0.9"/>
      <path d="M5 22 Q15 16 25 22" stroke="white" stroke-width="3" fill="none" opacity="0.9"/>
    </g>
    <g id="codeIcon">
      <text x="8" y="22" font-size="18" fill="white" font-weight="bold">&lt;/&gt;</text>
    </g>
    <g id="aiIcon">
      <circle cx="15" cy="15" r="10" stroke="white" stroke-width="2" fill="none"/>
      <circle cx="15" cy="15" r="4" fill="white"/>
      <line x1="15" y1="5" x2="15" y2="2" stroke="white" stroke-width="2"/>
      <line x1="15" y1="25" x2="15" y2="28" stroke="white" stroke-width="2"/>
      <line x1="5" y1="15" x2="2" y2="15" stroke="white" stroke-width="2"/>
      <line x1="25" y1="15" x2="28" y2="15" stroke="white" stroke-width="2"/>
    </g>
    <g id="fileIcon">
      <path d="M10 5 L20 5 L20 25 L10 25 Z" fill="white" opacity="0.9"/>
      <path d="M20 5 L20 10 L15 10 L15 5 Z" fill="white" opacity="0.6"/>
    </g>
    <g id="terminalIcon">
      <rect x="5" y="8" width="20" height="14" rx="2" fill="white" opacity="0.9"/>
      <path d="M9 13 L13 15 L9 17" stroke="#333" stroke-width="1.5" fill="none"/>
      <line x1="15" y1="18" x2="21" y2="18" stroke="#333" stroke-width="1.5"/>
    </g>
    <g id="securityIcon">
      <path d="M15 3 L22 7 L22 14 Q22 22 15 25 Q8 22 8 14 L8 7 Z" fill="white" opacity="0.9"/>
      <path d="M15 12 L15 18 M12 15 L18 15" stroke="#667eea" stroke-width="2"/>
    </g>
  </defs>
  
  <!-- 背景 -->
  <rect width="1000" height="600" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="500" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#2d3748" font-family="system-ui, -apple-system, sans-serif">Cline 架构总览</text>
  <text x="500" y="80" text-anchor="middle" font-size="14" fill="#718096" font-family="system-ui, -apple-system, sans-serif">六大核心组件协同工作</text>
  
  <!-- 组件 1: 用户界面 -->
  <g transform="translate(80, 120)" filter="url(#shadow)">
    <rect width="160" height="140" rx="12" fill="url(#primaryGrad)"/>
    <use href="#userIcon" x="65" y="20"/>
    <text x="80" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">用户界面</text>
    <text x="80" y="95" text-anchor="middle" font-size="12" fill="white" opacity="0.9" font-family="system-ui, -apple-system, sans-serif">VS Code 扩展</text>
    <text x="80" y="115" text-anchor="middle" font-size="11" fill="white" opacity="0.8" font-family="system-ui, -apple-system, sans-serif">聊天面板 / 命令</text>
  </g>
  
  <!-- 组件 2: API 层 -->
  <g transform="translate(280, 120)" filter="url(#shadow)">
    <rect width="160" height="140" rx="12" fill="url(#secondaryGrad)"/>
    <use href="#codeIcon" x="65" y="20"/>
    <text x="80" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">API 层</text>
    <text x="80" y="95" text-anchor="middle" font-size="12" fill="white" opacity="0.9" font-family="system-ui, -apple-system, sans-serif">请求路由</text>
    <text x="80" y="115" text-anchor="middle" font-size="11" fill="white" opacity="0.8" font-family="system-ui, -apple-system, sans-serif">认证 / 限流</text>
  </g>
  
  <!-- 组件 3: AI 模型 -->
  <g transform="translate(480, 120)" filter="url(#shadow)">
    <rect width="160" height="140" rx="12" fill="url(#accentGrad)"/>
    <use href="#aiIcon" x="65" y="20"/>
    <text x="80" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">AI 模型层</text>
    <text x="80" y="95" text-anchor="middle" font-size="12" fill="white" opacity="0.9" font-family="system-ui, -apple-system, sans-serif">LLM 推理</text>
    <text x="80" y="115" text-anchor="middle" font-size="11" fill="white" opacity="0.8" font-family="system-ui, -apple-system, sans-serif">Claude / GPT</text>
  </g>
  
  <!-- 组件 4: 文件系统 -->
  <g transform="translate(80, 320)" filter="url(#shadow)">
    <rect width="160" height="140" rx="12" fill="url(#successGrad)"/>
    <use href="#fileIcon" x="65" y="20"/>
    <text x="80" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">文件系统</text>
    <text x="80" y="95" text-anchor="middle" font-size="12" fill="white" opacity="0.9" font-family="system-ui, -apple-system, sans-serif">代码读写</text>
    <text x="80" y="115" text-anchor="middle" font-size="11" fill="white" opacity="0.8" font-family="system-ui, -apple-system, sans-serif">项目遍历</text>
  </g>
  
  <!-- 组件 5: 终端执行 -->
  <g transform="translate(280, 320)" filter="url(#shadow)">
    <rect width="160" height="140" rx="12" fill="#718096"/>
    <use href="#terminalIcon" x="65" y="20"/>
    <text x="80" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">终端执行</text>
    <text x="80" y="95" text-anchor="middle" font-size="12" fill="white" opacity="0.9" font-family="system-ui, -apple-system, sans-serif">Shell 命令</text>
    <text x="80" y="115" text-anchor="middle" font-size="11" fill="white" opacity="0.8" font-family="system-ui, -apple-system, sans-serif">进程管理</text>
  </g>
  
  <!-- 组件 6: 安全沙箱 -->
  <g transform="translate(480, 320)" filter="url(#shadow)">
    <rect width="160" height="140" rx="12" fill="#e53e3e"/>
    <use href="#securityIcon" x="65" y="20"/>
    <text x="80" y="75" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="system-ui, -apple-system, sans-serif">安全沙箱</text>
    <text x="80" y="95" text-anchor="middle" font-size="12" fill="white" opacity="0.9" font-family="system-ui, -apple-system, sans-serif">权限控制</text>
    <text x="80" y="115" text-anchor="middle" font-size="11" fill="white" opacity="0.8" font-family="system-ui, -apple-system, sans-serif">操作审计</text>
  </g>
  
  <!-- 连接箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>
  
  <!-- 用户界面 -> API 层 -->
  <path d="M240 190 L275 190" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- API 层 -> AI 模型 -->
  <path d="M440 190 L475 190" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- API 层 -> 文件系统 -->
  <path d="M340 260 L340 290 L160 290 L160 315" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- API 层 -> 终端 -->
  <path d="M360 260 L360 290 L360 315" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- API 层 -> 安全沙箱 -->
  <path d="M380 260 L380 290 L560 290 L560 315" stroke="#4a5568" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 底部说明 -->
  <rect x="50" y="500" width="900" height="80" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="525" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3748" font-family="system-ui, -apple-system, sans-serif">数据流向说明</text>
  <text x="500" y="550" text-anchor="middle" font-size="12" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">用户通过 VS Code 扩展发起请求 → API 层处理 → AI 模型生成响应 → 执行文件/终端操作 → 安全沙箱审计</text>
  <text x="500" y="570" text-anchor="middle" font-size="12" fill="#4a5568" font-family="system-ui, -apple-system, sans-serif">所有操作均经过权限验证和日志记录</text>
</svg>
